<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Nativele</title>
  <desc id="d">Designed for AI agents. Driven by TypeScript. Defined in vanilla HTML. Names in the HTML are checked against the TypeScript class by tsc.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="85" y="206" fill="#f8fafc" font-size="96" font-weight="700" letter-spacing="-2">Nativele</text>
    <g font-size="34" font-weight="600">
      <text x="100" y="310"><tspan fill="#5eead4">Designed</tspan><tspan fill="#e2e8f0"> for AI agents.</tspan></text>
      <text x="170" y="400"><tspan fill="#fbbf24">Driven</tspan><tspan fill="#e2e8f0"> by TypeScript.</tspan></text>
      <text x="240" y="490"><tspan fill="#f472b6">Defined</tspan><tspan fill="#e2e8f0"> in vanilla HTML.</tspan></text>
    </g>
  </g>
  <g font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="20">
    <rect x="760" y="120" width="440" height="150" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="784" y="156" fill="#64748b">task-row.html</text>
    <text x="784" y="200" fill="#e2e8f0">&lt;button</text>
    <text x="808" y="232"><tspan fill="#fbbf24">data-on-click</tspan><tspan fill="#e2e8f0">=</tspan><tspan fill="#5eead4">"save"</tspan><tspan fill="#e2e8f0">&gt;</tspan></text>
    <rect x="760" y="380" width="440" height="150" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="784" y="416" fill="#64748b">task-row.ts</text>
    <text x="784" y="460" fill="#e2e8f0">class TaskRow extends</text>
    <text x="808" y="492"><tspan fill="#e2e8f0">Component(tpl) { </tspan><tspan fill="#5eead4">save</tspan><tspan fill="#e2e8f0">() }</tspan></text>
    <path d="M980 270 V380" stroke="#5eead4" stroke-width="3" stroke-dasharray="6 8"/>
    <rect x="910" y="303" width="140" height="44" rx="22" fill="#0f172a" stroke="#5eead4" stroke-width="2"/>
    <text x="980" y="332" fill="#5eead4" text-anchor="middle">tsc ✓</text>
  </g>
</svg>
