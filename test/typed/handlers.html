<x-child data-on-value-change="onValue"></x-child>
<button type="button" data-on-click="onClick">Click</button>
<input aria-label="Key" data-on-keydown="onKey" data-on-change="onChange" />
<form data-on-submit="onSubmit"></form>
<div data-on-item-picked="onUnknown"></div>
<button type="button" data-on-click="onBoth">Both</button>
<x-child data-on-closed="onBoth"></x-child>
<ul>
  <template data-each="rows">
    <li><button type="button" data-on-click="onRow">Row</button></li>
  </template>
</ul>
