name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      check: ${{ steps.diff.outputs.check }}
      browser: ${{ steps.diff.outputs.browser }}
      smoke: ${{ steps.diff.outputs.smoke }}
      nobundler: ${{ steps.diff.outputs.nobundler }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Each job runs only for the files it depends on. Jobs are skipped with `if`, not with paths-ignore, so the required
      # checks still report; the matrix job skips its steps instead, because a skipped matrix job does not report the
      # per-version check names. SKILL.md and the Skill examples have their own workflows.
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          files="$(git diff --name-only "$range" 2>/dev/null || true)"
          echo "$files"
          has() { echo "$files" | grep -qE "$1"; }
          all=false
          if [ -z "$files" ] || has '^(src/|package(-lock)?\.json$|tsconfig\.json$|vite\.config\.ts$|\.github/workflows/ci\.yml$)'; then all=true; fi
          check=$all; browser=$all; smoke=$all; nobundler=$all
          if echo "$files" | grep -qvE '(\.md$|^LICENSE$|^llms\.txt$|^\.gitignore$|^skills/|^\.github/)'; then check=true; fi
          if has '^(browser|examples)/'; then browser=true; fi
          if has '^scripts/consumer-smoke\.sh$'; then smoke=true; fi
          if has '^scripts/no-bundler-smoke\.sh$'; then nobundler=true; fi
          { echo "check=$check"; echo "browser=$browser"; echo "smoke=$smoke"; echo "nobundler=$nobundler"; } | tee -a "$GITHUB_OUTPUT"

  check:
    name: Types, unit tests and lint (Node ${{ matrix.node }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.check == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.check == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.check == 'true'
      - run: npm run gen
        if: needs.changes.outputs.check == 'true'
      - run: npx tsc
        if: needs.changes.outputs.check == 'true'
      - run: npm test
        if: needs.changes.outputs.check == 'true'
      - run: npm run lint
        if: needs.changes.outputs.check == 'true'
      - run: npm run lint:html
        if: needs.changes.outputs.check == 'true'
      - run: npm run verify:pack
        if: needs.changes.outputs.check == 'true'

  browser:
    name: Real browser tests (Chromium)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gen
      # The runner ships google-chrome; when it is missing, launchChrome falls back to Playwright's Chromium
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser

  no-bundler:
    name: Fresh project with only typescript (no Vite)
    needs: changes
    if: needs.changes.outputs.nobundler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run smoke:no-bundler

  consumer:
    name: Fresh project with Vite
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run smoke
