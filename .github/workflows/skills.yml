name: Skills

# A required check: it runs on every pull request and push, and skips its steps (not the job) when nothing it
# checks changed, so it always reports. The Skill examples are references and are not run here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Skill changes
    runs-on: ubuntu-latest
    outputs:
      format: ${{ steps.diff.outputs.format }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          case "${{ github.event_name }}" in
            pull_request) range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" ;;
            push) range="${{ github.event.before }}..${{ github.sha }}" ;;
            *) range="" ;;
          esac
          files=""
          if [ -n "$range" ]; then files="$(git diff --name-only "$range" 2>/dev/null || true)"; fi
          echo "$files"
          has() { echo "$files" | grep -qE "$1"; }
          all=false
          if [ -z "$files" ] || has '^\.github/workflows/skills\.yml$'; then all=true; fi
          format=$all
          # test/skills.test.ts also checks the links in the READMEs, llms.txt and the guides.
          if has '^(skills/|docs/|README|llms\.txt$|test/skills\.test\.ts$|src/)'; then format=true; fi
          echo "format=$format" | tee -a "$GITHUB_OUTPUT"

  format:
    name: SKILL.md format
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.format == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.format == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.format == 'true'
      - run: npx vitest run test/skills.test.ts
        if: needs.changes.outputs.format == 'true'
